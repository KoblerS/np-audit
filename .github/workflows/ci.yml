name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        node-version: [ 18, 20, 22, 24 ]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: node test/index.js

      - name: Install package globally
        run: npm install -g .

      - name: Verify npa command
        run: npa --version

      - name: Verify np-audit command
        run: np-audit --version

      - name: Test npa scan (no lockfile)
        run: |
          mkdir test-project
          cd test-project
          npm init -y
          npa scan
