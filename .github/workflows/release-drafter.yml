name: Release Drafter

on:
  push:
    branches:
      - main
  # Also re-run when a PR is merged (closed + merged)
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  id-token: write       # OIDC token for provenance
  contents: write       # Create/update draft releases
  pull-requests: write  # Read PR titles/labels + add release notes from PRs

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # Full history needed to analyse commits for changelog

      - uses: KoblerS/release-drafter@49bc6fe409213d41eaa55e6170faabfa66d49943  # v1.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate-release-notes: true
          version-prefix: 'v'
