name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Run tests before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'

      - name: Run tests
        run: node test/index.js

  publish:
    name: Publish to npmjs.com
    needs: test
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Sync package.json version with the GitHub release tag (strips leading "v")
      - name: Set version from release tag
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          npm version "$VERSION" --no-git-tag-version
          # Pre-release versions (x.y.z-*) publish under "beta", stable under "latest"
          if [[ "$VERSION" == *"-"* ]]; then
            echo "PUBLISH_TAG=beta" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_TAG=latest" >> "$GITHUB_ENV"
          fi

      - name: Publish
        run: npm publish --provenance --access public --tag "$PUBLISH_TAG"
