name: Publish to npm

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        node-version: [ 18, 20, 22, 24 ]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: node test/index.js

      - name: Install package globally
        run: npm install -g .

      - name: Verify npa command
        run: npa --version

      - name: Verify np-audit command
        run: np-audit --version

  publish:
    name: Publish to npmjs.com
    needs: test
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write # Required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Sync package.json version with the GitHub release tag (strips leading "v")
      - name: Set version from release tag
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          npm version "$VERSION" --no-git-tag-version
          # Pre-release versions (x.y.z-*) publish under "beta", stable under "latest"
          if [[ "$VERSION" == *"-"* ]]; then
            echo "PUBLISH_TAG=beta" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_TAG=latest" >> "$GITHUB_ENV"
          fi

      - name: Publish
        run: npm publish --provenance --access public --tag "$PUBLISH_TAG"
